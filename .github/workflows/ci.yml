# CI for MailReserve. See AGENTS.md "CI" for the rules around this file.
#
# All jobs run on GitHub-hosted runners (free and unlimited for public repos).
# engine  - Linux, inside the pinned swift:6.4.0-noble container, with GreenMail as a service
#           container for the integration tests.
# app     - macOS. Builds and tests everything that needs macOS: the Keychain adapter now,
#           the SwiftUI app from Milestone 2.
# ci-gate - the single required status check in the branch rulesets.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine:
    name: engine (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.4.0-noble
    services:
      # Fake IMAP/SMTP server for integration tests: IMAP 3143, IMAPS 3993, SMTP 3025.
      # One fake user, test@localhost / test-password. Never a real account.
      greenmail:
        image: greenmail/standalone:2.1.14
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=test:test-password@localhost
            -Dgreenmail.users.login=email
    env:
      MAILRESERVE_IMAP_TEST_HOST: greenmail
      MAILRESERVE_REQUIRE_INTEGRATION: "1"
    steps:
      # git before checkout so actions/checkout makes a real clone; jq for the coverage gate.
      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends git jq

      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      # The service container starts before the steps, but GreenMail may still be booting.
      # Wait until a real IMAP LOGIN succeeds, not just until the port opens.
      - name: Wait for GreenMail
        shell: bash
        run: |
          for _ in $(seq 1 60); do
            if (
              exec 3<>/dev/tcp/greenmail/3143
              printf 'a1 LOGIN test@localhost test-password\r\na2 LOGOUT\r\n' >&3
              timeout 5 grep -m1 -q '^a1 OK' <&3
            ) 2>/dev/null; then
              echo "GreenMail is ready"
              exit 0
            fi
            sleep 1
          done
          echo "GreenMail did not become ready" >&2
          exit 1

      # Unit and integration tests in one run so coverage counts both.
      # MAILRESERVE_REQUIRE_INTEGRATION=1 makes integration tests fail instead of skipping.
      - name: Test (unit + integration, with coverage)
        run: swift test --enable-code-coverage

      - name: Coverage gate (MailReserveKit >= 80%)
        run: scripts/ci/check-coverage.sh 80

  app:
    name: app (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # Integration tests skip here (no GreenMail on the macOS runner, which has no Docker);
      # they are enforced in the engine job.
      - name: Build and test package
        run: swift test

      - name: Release build
        run: swift build -c release

      # M0 spike (separate package, exempt from tests): keep it compiling while it is in use.
      - name: Build Spike
        run: swift build --package-path Spike

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [engine, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "a required job did not succeed" >&2; exit 1; }
          done
